<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern line -->
  <path d="M 64 256 L 448 256 M 256 64 L 256 448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Hardhat & Construction Crane Vector Group -->
  <g filter="url(#glow)">
    <!-- Helmet Top Ridge -->
    <path d="M 236 120 C 236 112 276 112 276 120 L 276 210 L 236 210 Z" fill="#fbbf24" />
    <!-- Helmet Main Dome -->
    <path d="M 120 236 C 120 155 178 132 256 132 C 334 132 392 155 392 236 Z" fill="url(#helmetGrad)" />
    <!-- Helmet Rim / Visor -->
    <rect x="92" y="232" width="328" height="34" rx="17" fill="#f59e0b" />
    <!-- Inner Shadow Curve -->
    <path d="M 120 232 C 140 216 200 206 256 206 C 312 206 372 216 392 232" stroke="#d97706" stroke-width="5" fill="none" opacity="0.6" />
  </g>

  <!-- Modern Foundation / Metro Pier Pillar Block -->
  <g transform="translate(176, 290)">
    <rect x="0" y="0" width="160" height="96" rx="18" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <!-- Digital Bar Indicators (Payroll / Muster status) -->
    <rect x="24" y="24" width="48" height="12" rx="6" fill="#10b981" />
    <rect x="24" y="44" width="80" height="12" rx="6" fill="#38bdf8" />
    <rect x="24" y="64" width="112" height="12" rx="6" fill="#f59e0b" />
    <!-- Checkmark indicator -->
    <circle cx="126" cy="30" r="14" fill="#10b981" />
    <path d="M 120 30 L 124 34 L 132 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- App Brand Name Indicator -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="4" text-anchor="middle">BUILDFORCE</text>
</svg>
